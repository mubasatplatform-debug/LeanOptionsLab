name: lean-options-lab-gateway

services:
  gateway:
    image: lean-options-lab-gateway:${GATEWAY_IMAGE_TAG:?Set GATEWAY_IMAGE_TAG}
    build:
      context: .
      target: final
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_EnableDiagnostics: "0"
      LEAN_OPTIONS_LAB_RESULTS_ROOT: /results
    volumes:
      - type: bind
        source: ${GATEWAY_RESULT_SOURCE:?Set GATEWAY_RESULT_SOURCE}
        target: /results/${GATEWAY_RUN_ID:?Set GATEWAY_RUN_ID}
        read_only: true
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:?Set GATEWAY_HOST_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "dotnet", "LeanOptionsLab.Gateway.dll", "--health-probe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
